name: Bug report
description: Report incorrect behaviour in the specification, proofs, witnesses, or tooling.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: State the incorrect behaviour directly.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands, the Lean declaration or Rust witness involved, and any input.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, rustc version, Lean toolchain version.
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Verbatim command output, Lean errors, or recorded traces.
      render: shell
