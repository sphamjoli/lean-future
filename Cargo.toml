[workspace]
resolver = "3"
members = ["crates/future-witnesses", "crates/trace-recorder", "crates/spec-lint"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Rust release the specification is pinned to (see spec/claims.toml).
rust-version = "1.97"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
parking_lot = "0.12"
thiserror = "2"
