# Gitleaks configuration. Extends the upstream default ruleset; no project secrets or key material exist in this repository.

title = "lean-future gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Local build output, never committed but present if this scan ever runs after a build step or on a local dirty working tree — gitleaks dir walks the raw filesystem and does not honor .gitignore"
paths = [
  '''(^|/)target/''',
  '''(^|/)\.lake/''',
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
]
