# Claim catalogue — the specification's source of truth.
# Every clause: where Rust says it, what kind of claim it is, and its evidence status.
#   kind:   type_level | permitted | rejected | contract | caller_protocol | executor | implementation
#   status: proved (Lean, core axioms only) | modelled (stated in Lean, unproved)
#           | assumed (taken as a hypothesis) | open (not yet stated)
# Rule: never upgrade a status without the Lean/Rust artefact that earns it. Enforced by `cargo run -p spec-lint`.
rust_version = "1.97.1"

[[claim]]
id = "poll-returns-poll"
text = "A normally returning poll produces Pending or Ready"
kind = "type_level"
status = "modelled"
source = "https://doc.rust-lang.org/1.97.1/std/task/enum.Poll.html"
lean = "RustFuture.Poll"

[[claim]]
id = "may-never-complete"
text = "A future can remain pending forever"
kind = "permitted"
status = "proved"
source = "https://doc.rust-lang.org/1.97.1/std/future/fn.pending.html"
lean = "RustFuture.Counterexamples.termination_not_universal"

[[claim]]
id = "termination-universal"
text = "Every future eventually completes"
kind = "rejected"
status = "proved"
source = "https://doc.rust-lang.org/1.97.1/std/future/fn.pending.html"
lean = "RustFuture.Counterexamples.termination_not_universal"
refuted_by = "pending_never_completes"

[[claim]]
id = "must-register-waker"
text = "Every future must register or use a waker"
kind = "rejected"
status = "open"
source = "https://doc.rust-lang.org/1.97.1/std/future/fn.ready.html"
refuted_by = "ready_completes_without_wake"

[[claim]]
id = "wake-implies-ready"
text = "A wake guarantees the next poll returns Ready"
kind = "rejected"
status = "open"
source = "https://doc.rust-lang.org/1.97.1/std/task/struct.Waker.html"
refuted_by = "self_wake_then_pending_again"

[[claim]]
id = "ready-absorbing"
text = "Ready is final and polling again is harmless (rustc-generated async fns panic on re-poll at the pinned release)"
kind = "rejected"
status = "open"
source = "https://doc.rust-lang.org/1.97.1/std/future/trait.Future.html#panics"
refuted_by = "async_fn_repoll_panics"

[[claim]]
id = "ready-is-success"
text = "Ready implies application-level success"
kind = "rejected"
status = "open"
source = "https://doc.rust-lang.org/1.97.1/std/task/enum.Poll.html"
refuted_by = "ready_is_not_success"

[[claim]]
id = "no-ub-after-ready"
text = "Polling after completion must not cause undefined behaviour"
kind = "contract"
status = "modelled"
source = "https://doc.rust-lang.org/1.97.1/std/future/trait.Future.html#panics"
lean = "RustFuture.Contracts.NoUB"

[[claim]]
id = "caller-stops-at-ready"
text = "A well-behaved caller does not poll after Ready"
kind = "caller_protocol"
status = "modelled"
source = "https://doc.rust-lang.org/1.97.1/std/future/trait.Future.html#panics"
lean = "RustFuture.Contracts.CallerStopsAtReady"

[[claim]]
id = "latest-waker"
text = "If any wake occurs in a suspension epoch, some wake in that epoch (possibly during the poll) targets the same task as the most recent poll's waker"
kind = "contract"
status = "modelled"
source = "https://doc.rust-lang.org/1.97.1/std/future/trait.Future.html#return-value"
lean = "RustFuture.Contracts.WakesLatest"

[[claim]]
id = "latest-waker-refutable"
text = "WakesLatest rejects a trace that wakes only a stale waker"
kind = "contract"
status = "proved"
source = "https://doc.rust-lang.org/1.97.1/std/future/trait.Future.html#return-value"
lean = "RustFuture.Counterexamples.stale_violates_latest"

[[claim]]
id = "wake-delivery"
text = "While the executor runs and the task is unfinished, a wake is followed by at least one poll of that task that the wake happens before (happens-before is supplied by the executor model, must chain and point forwards, and is not derived from trace order)"
kind = "executor"
status = "assumed"
source = "https://doc.rust-lang.org/1.97.1/std/task/struct.Waker.html#method.wake"
lean = "RustFuture.Contracts.WakeDelivery"

[[claim]]
id = "poll-non-blocking"
text = "poll should return promptly without blocking"
kind = "contract"
status = "open"
source = "https://doc.rust-lang.org/1.97.1/std/future/trait.Future.html#runtime-characteristics"

[[claim]]
id = "no-lost-wakeup"
text = "Suspended and value available implies the latest waker was notified, a poll is in flight, or the sender still owes a notification"
kind = "implementation"
status = "modelled"
source = "https://doc.rust-lang.org/1.97.1/std/task/struct.Waker.html"
lean = "RustFuture.Properties.NoLostWakeup"

[[claim]]
id = "buggy-receiver-loses-wake"
text = "The faulty oneshot receiver reaches, by an actual execution, a state where it is waiting, the value is there, its latest waker was never woken and the sender owes nothing"
kind = "implementation"
status = "proved"
source = "https://doc.rust-lang.org/1.97.1/std/task/struct.Waker.html"
lean = "RustFuture.Counterexamples.buggy_violates_noLostWakeup"
refuted_by = "buggy_oneshot_loses_wake"

[[claim]]
id = "correct-receiver-no-lost-wakeup"
text = "In every reachable state of the correct oneshot receiver, if it is waiting and the value is there, its latest waker has been woken or the sender still owes that waker a wake"
kind = "implementation"
status = "proved"
source = "https://doc.rust-lang.org/1.97.1/std/task/struct.Waker.html"
lean = "RustFuture.Implementations.correct_noLostWakeup"

[[claim]]
id = "correct-receiver-sender-pays"
text = "On every run of the correct oneshot in which the sender eventually makes any wake it owes, a wake owed to the latest waker is delivered or the receiver completes at a strictly later point"
kind = "implementation"
status = "proved"
source = "https://doc.rust-lang.org/1.97.1/std/task/struct.Waker.html#method.wake"
lean = "RustFuture.Implementations.correct_senderEventuallyPays"

[[claim]]
id = "pin-unpin-exempt"
text = "Unpin futures are exempt from pinning restrictions"
kind = "type_level"
status = "assumed"
source = "https://doc.rust-lang.org/1.97.1/std/pin/index.html"
lean = "RustFuture.Rust.PinModel"

[[claim]]
id = "latest-waker-satisfiable"
text = "WakesLatest accepts a trace that wakes the most recent waker"
kind = "contract"
status = "proved"
source = "https://doc.rust-lang.org/1.97.1/std/future/trait.Future.html#return-value"
lean = "RustFuture.Counterexamples.latest_satisfiable"

[[claim]]
id = "wake-delivery-refutable"
text = "WakeDelivery rejects a wake on a live task with no later poll"
kind = "executor"
status = "proved"
source = "https://doc.rust-lang.org/1.97.1/std/task/struct.Waker.html#method.wake"
lean = "RustFuture.Contracts.wakeDelivery_refutable"

[[claim]]
id = "progress-notifies"
text = "If progress becomes possible during a suspension epoch while the future is still wanted, then eventually a wake reaches the task of its current waker, or it completes with Ready, or it is dropped or the program aborts; a new poll alone does not discharge the obligation"
kind = "contract"
status = "modelled"
source = "https://doc.rust-lang.org/1.97.1/std/future/trait.Future.html#return-value"
lean = "RustFuture.Contracts.ProgressNotifies"

[[claim]]
id = "pending-implies-wake"
text = "Pending implies an eventual wake"
kind = "rejected"
status = "proved"
source = "https://doc.rust-lang.org/1.97.1/std/future/fn.pending.html"
lean = "RustFuture.Implementations.pending_without_wake"
refuted_by = "pending_never_completes"

[[claim]]
id = "drop-reverses-effects"
text = "Dropping a future reverses its effects"
kind = "rejected"
status = "open"
source = "https://doc.rust-lang.org/1.97.1/std/future/trait.Future.html"
refuted_by = "drop_does_not_undo_effects"

[[claim]]
id = "assumptions-consistent"
text = "Assumptions and obligations hold together on a run where a live wake, its delivery, a latest-waker window and a progress opportunity all occur"
kind = "contract"
status = "proved"
source = "https://doc.rust-lang.org/1.97.1/std/future/trait.Future.html"
lean = "RustFuture.Contracts.assumptions_consistent_live"

[[claim]]
id = "will-wake-equivalence"
text = "A future may keep an older waker that wakes the same task (Waker::will_wake); WakesLatest accepts waking only that older waker"
kind = "permitted"
status = "proved"
source = "https://doc.rust-lang.org/1.97.1/std/task/struct.Waker.html#method.will_wake"
lean = "RustFuture.Counterexamples.will_wake_accepted"

[[claim]]
id = "safety-independent-of-protocol"
text = "Memory safety is required on every well-formed run with valid access, even if the caller or executor breaks the protocol"
kind = "contract"
status = "modelled"
source = "https://doc.rust-lang.org/1.97.1/std/future/trait.Future.html#panics"
lean = "RustFuture.Contracts.SafetyConforms"

[[claim]]
id = "well-formed-executions"
text = "Real callers produce well-formed executions: visit numbers are unique, polls do not overlap, the future is not dropped during a poll, and nothing is polled after drop or abort (a caught panic may be followed by another poll)"
kind = "type_level"
status = "modelled"
source = "https://doc.rust-lang.org/1.97.1/std/future/trait.Future.html#tymethod.poll"
lean = "RustFuture.WellFormed"

[[claim]]
id = "pending-trace-well-formed"
text = "The canonical run of the pending model is well formed"
kind = "implementation"
status = "proved"
source = "https://doc.rust-lang.org/1.97.1/std/future/fn.pending.html"
lean = "RustFuture.Implementations.pendingTrace_wellFormed"

[[claim]]
id = "calls-matched"
text = "A future's returns and panics each answer an earlier visit, and each visit ends at most once (required as part of safety, not assumed)"
kind = "contract"
status = "modelled"
source = "https://doc.rust-lang.org/1.97.1/std/future/trait.Future.html#tymethod.poll"
lean = "RustFuture.CallsMatched"

[[claim]]
id = "epoch-not-confused"
text = "A reused visit number cannot make a wake from an earlier epoch count for a later one"
kind = "contract"
status = "proved"
source = "https://doc.rust-lang.org/1.97.1/std/future/trait.Future.html#return-value"
lean = "RustFuture.Counterexamples.epoch_not_confused"

[[claim]]
id = "sender-eventually-pays"
text = "Whenever a sender owes the latest waker a notification, the notification is delivered or the future completes strictly later (companion to no-lost-wakeup)"
kind = "implementation"
status = "modelled"
source = "https://doc.rust-lang.org/1.97.1/std/task/struct.Waker.html#method.wake"
lean = "RustFuture.Properties.SenderEventuallyPays"

[[claim]]
id = "busy-executor-does-not-hide"
text = "A future polled for ever that always returns Pending and never wakes, while progress is possible, violates ProgressNotifies"
kind = "contract"
status = "proved"
source = "https://doc.rust-lang.org/1.97.1/std/future/trait.Future.html#return-value"
lean = "RustFuture.Counterexamples.busy_executor_does_not_hide"

[[claim]]
id = "cancellation-discharges"
text = "Dropping a suspended future after progress becomes possible discharges its notification obligation"
kind = "permitted"
status = "proved"
source = "https://doc.rust-lang.org/1.97.1/std/future/trait.Future.html"
lean = "RustFuture.Counterexamples.cancellation_discharges"

[[claim]]
id = "sender-pays-nonvacuous"
text = "A fair run of the correct oneshot exists in which the sender owes the latest waker a wake, so the liveness theorem's premise can hold"
kind = "implementation"
status = "proved"
source = "https://doc.rust-lang.org/1.97.1/std/task/struct.Waker.html#method.wake"
lean = "RustFuture.Implementations.exampleRun_witness"
